[package]
name = "agent-bash-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "General-purpose always-background bash spooler for AI agents"
license = "MIT"
repository = "https://github.com/nestharus/agent-bash-tool"

[[bin]]
name = "agent-bash"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
